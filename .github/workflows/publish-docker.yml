name: Publish agent-forge image

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    # Docker's reusable builder distributes platforms across separate native
    # runners: ubuntu-24.04 for AMD64 and ubuntu-24.04-arm for ARM64. This
    # avoids storing both large build graphs on one 14 GB runner disk.
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      context: .
      file: ./Dockerfile
      target: final
      build-args: |
        INSTALL_HERMES=false
        INSTALL_REDTEAM=false
        INSTALL_BLUETEAM=false
      cache: true
      cache-scope: agent-forge-base
      meta-images: deruke/agent-forge
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
        type=sha,prefix=sha-
      set-meta-labels: true
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
