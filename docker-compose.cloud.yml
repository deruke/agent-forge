# Cloud security overlay — use with:
#   docker compose -f docker-compose.yml -f docker-compose.cloud.yml up
#
# Adds: AWS CLI, Azure CLI, Google Cloud CLI, ScoutSuite, Prowler
# Requires: cloud provider credentials via .env or volume-mounted config
services:
  cloud:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    network_mode: "service:forge"
    security_opt:
      - "no-new-privileges:true"
    cap_drop: [ALL]               # cloud CLIs need no raw sockets
    pids_limit: 512
    mem_limit: 6g
    cpus: "4.0"
    stdin_open: true
    tty: true
    env_file:
      - .env
    volumes:
      - ./workspace:/home/operator/workspace
      # Mount host cloud configs if available
      - ${HOME}/.aws:/home/operator/.aws:ro
      - ${HOME}/.azure:/home/operator/.azure:ro
      - ${HOME}/.config/gcloud:/home/operator/.config/gcloud:ro
